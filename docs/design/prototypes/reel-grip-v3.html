<style>
#moon-reel-grip-v3{padding:12px 0;}
#moon-reel-grip-v3 .viz-controls{max-width:390px;margin:0 auto 12px;}
#moon-reel-grip-v3 .moon-grip-field{position:relative;width:min(390px,100%);aspect-ratio:9/16;margin:auto;overflow:hidden;border-radius:20px;background:#8fc1be;color:#4f6957;font:14px/1.4 system-ui,"Microsoft YaHei",sans-serif;}
#moon-reel-grip-v3 .moon-grip-scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
#moon-reel-grip-v3 .moon-grip-context{position:absolute;right:18px;top:16px;font-size:11px;color:#f0eed9;text-shadow:0 1px 3px #38504a;}
#moon-reel-grip-v3 .moon-grip-control{position:absolute;right:32px;bottom:52px;width:112px;height:112px;pointer-events:none;--grip-x:0px;--grip-y:0px;--grip-depth:0px;--link-length:0px;--link-angle:0deg;}
#moon-reel-grip-v3 .moon-grip-rail{position:absolute;left:32px;top:-34px;width:48px;height:180px;border-radius:26px;background:#55746275;box-shadow:inset 0 2px 3px #3c544925,0 1px 0 #e8ead880;transform:scaleY(.6);transition:transform .18s,background .12s;}
#moon-reel-grip-v3 .moon-grip-input{position:absolute;inset:0;width:112px;height:112px;padding:0;background:transparent;border:0;border-radius:36px;color:#5d705b;pointer-events:auto;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#moon-reel-grip-v3 .moon-grip-head{position:absolute;left:22px;top:20px;width:68px;height:72px;border-radius:30px;background:linear-gradient(145deg,#eee9ce,#d7dfc2 85%);box-shadow:inset 0 2px 1px #fff5d480,inset 0 -2px 2px #bac4a180,0 4px 0 #a39770,0 7px 8px #3d554638;transform:translate(var(--grip-x),calc(var(--grip-y) + var(--grip-depth)));transition:transform .18s cubic-bezier(.2,.8,.25,1),box-shadow .09s;pointer-events:none;}
#moon-reel-grip-v3 .moon-grip-grooves{position:absolute;left:22px;top:28px;width:24px;display:grid;gap:6px;}
#moon-reel-grip-v3 .moon-grip-grooves i{height:3px;border-radius:3px;background:#9aaa8775;box-shadow:0 1px 0 #f3efd5c0;}
#moon-reel-grip-v3 .moon-grip-control:not([data-input="idle"]) .moon-grip-head{transition:box-shadow .09s;box-shadow:inset 0 2px 2px #87987532,0 2px 0 #a39770,0 4px 5px #3d554630;}
#moon-reel-grip-v3 .moon-grip-control:not([data-input="idle"]) .moon-grip-rail{transform:scaleY(1);background:#52746099;}
#moon-reel-grip-v3 .moon-grip-link{position:absolute;left:56px;top:52px;height:8px;width:var(--link-length);transform:rotate(var(--link-angle));transform-origin:0 50%;border-radius:5px;background:#d9ddbc90;opacity:0;}
#moon-reel-grip-v3 .moon-grip-control:not([data-input="idle"]) .moon-grip-link{opacity:1;}
#moon-reel-grip-v3 .moon-grip-top,#moon-reel-grip-v3 .moon-grip-bottom{position:absolute;left:43px;width:26px;height:26px;display:grid;place-items:center;color:#cad4bb;opacity:0;transition:opacity .1s;}
#moon-reel-grip-v3 .moon-grip-top{top:-37px;}
#moon-reel-grip-v3 .moon-grip-bottom{bottom:-37px;}
#moon-reel-grip-v3 .moon-grip-chevron{display:block;width:8px;height:8px;border-top:2px solid currentColor;border-left:2px solid currentColor;transform:translateY(3px) rotate(45deg);}
#moon-reel-grip-v3 .moon-grip-bottom .moon-grip-chevron{transform:translateY(-3px) rotate(225deg);}
#moon-reel-grip-v3 .moon-grip-control:not([data-input="idle"]) .moon-grip-top,#moon-reel-grip-v3 .moon-grip-control:not([data-input="idle"]) .moon-grip-bottom{opacity:.6;}
#moon-reel-grip-v3 .moon-grip-control[data-guide="up"] .moon-grip-top{color:#f3d39a;opacity:1;animation:moon-grip-offer .24s ease-out;}
#moon-reel-grip-v3 .moon-grip-control[data-input="payout"] .moon-grip-bottom{color:#f3d39a;opacity:1;}
#moon-reel-grip-v3 .moon-grip-check,#moon-reel-grip-v3 .moon-grip-confirm{display:none;width:7px;height:12px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(40deg);}
#moon-reel-grip-v3 .moon-grip-control[data-result="lift"] .moon-grip-top{color:#f3d39a;opacity:1;}
#moon-reel-grip-v3 .moon-grip-control[data-result="lift"] .moon-grip-top .moon-grip-chevron{display:none;}
#moon-reel-grip-v3 .moon-grip-control[data-result="lift"] .moon-grip-check{display:block;}
#moon-reel-grip-v3 .moon-grip-confirm{position:absolute;left:29px;top:26px;color:#647c51;}
#moon-reel-grip-v3 .moon-grip-control[data-result="hooked"] .moon-grip-grooves,#moon-reel-grip-v3 .moon-grip-control[data-result="retrieved"] .moon-grip-grooves{visibility:hidden;}
#moon-reel-grip-v3 .moon-grip-control[data-result="hooked"] .moon-grip-confirm,#moon-reel-grip-v3 .moon-grip-control[data-result="retrieved"] .moon-grip-confirm{display:block;}
#moon-reel-grip-v3 .moon-grip-danger{position:absolute;left:12px;top:33px;width:88px;height:40px;opacity:0;}
#moon-reel-grip-v3 .moon-grip-danger:before,#moon-reel-grip-v3 .moon-grip-danger:after{content:"";position:absolute;width:3px;height:22px;top:9px;background:#c57859;border-radius:3px;}
#moon-reel-grip-v3 .moon-grip-danger:before{left:0;transform:rotate(8deg);}
#moon-reel-grip-v3 .moon-grip-danger:after{right:0;transform:rotate(-8deg);}
#moon-reel-grip-v3 .moon-grip-control[data-tone="danger"] .moon-grip-danger{opacity:1;}
#moon-reel-grip-v3 .moon-grip-correction{position:absolute;right:118px;top:42px;white-space:nowrap;color:#fff0d1;text-shadow:0 1px 3px #493c2a;font-size:12px;pointer-events:none;}
#moon-reel-grip-v3 .moon-grip-correction[hidden]{display:none;}
#moon-reel-grip-v3 .moon-grip-reader{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;}
@keyframes moon-grip-offer{from{transform:translateY(4px);}to{transform:translateY(0);}}
@media(prefers-reduced-motion:reduce){#moon-reel-grip-v3 .moon-grip-head,#moon-reel-grip-v3 .moon-grip-rail,#moon-reel-grip-v3 .moon-grip-top,#moon-reel-grip-v3 .moon-grip-bottom{transition:none;animation:none!important;}}
</style>
<script>
(() => {
 const root=document.getElementById('moon-reel-grip-v3');
 const picker=root.querySelector('#moon-grip-scene'),play=root.querySelector('#moon-grip-play'),control=root.querySelector('.moon-grip-control'),button=root.querySelector('.moon-grip-input'),correction=root.querySelector('.moon-grip-correction'),reader=root.querySelector('.moon-grip-reader');
 const allowed=['steady','bite','window','danger','slack','retrieve'];
 const saved=window.openai?.widgetState?.modelContent?.scene;
 let scene=allowed.includes(saved)?saved:'window',gesture=null,held=false,paying=false,lifted=false,windowUsed=false,released=false,event='',eventTimer=0,dx=0,dy=0,playFrame=0,playing=false;
 function render(){
  const side=gesture&&Math.abs(dx)>30;
  let mode=gesture?(paying?'payout':lifted?'lift':side?'side':'hold'):'idle';
  let guide=scene==='window'&&!windowUsed?'up':'none';
  let result=lifted||event==='lift'?'lift':event==='hooked'?'hooked':event==='retrieved'?'retrieved':'none';
  let short=event==='slack'?'先收紧':event==='blocked'?'先稳住':'';
  if(scene==='danger'){result='none';guide='none';short=held?'松手':'';}
  else if(paying||lifted)short='';
  const rawX=Number.isFinite(dx)?Math.max(-24,Math.min(24,dx*.7)):0;
  const rawY=Number.isFinite(dy)?Math.max(-34,Math.min(34,dy*.7)):0;
  const limit=Math.max(1,Math.hypot(rawX/24,rawY/34));
  const x=gesture?rawX/limit:0,y=gesture?rawY/limit:0;
  control.style.setProperty('--grip-x',x+'px');control.style.setProperty('--grip-y',y+'px');
  control.style.setProperty('--grip-depth',gesture?'2px':'0px');
  control.style.setProperty('--link-length',Math.hypot(x,y)+'px');control.style.setProperty('--link-angle',Math.atan2(y,x)*180/Math.PI+'deg');
  control.dataset.input=mode;control.dataset.guide=guide;control.dataset.result=result;control.dataset.tone=scene==='danger'?'danger':'steady';
  correction.textContent=short;correction.hidden=!short;
  const action=paying?'正在让线':lifted?'抬竿已生效，滑回中位收线':side?'正在调竿':held?'正在收线':scene==='bite'?'按住提竿':scene==='retrieve'?'点按收回':'按住收线';
  const status=scene==='danger'?(held?'受力临界，松手':released?'已松手，仍在卸力':'受力临界'):scene==='slack'?'鱼线松了':guide==='up'?'可以上划抬竿':'';
  const message=[action,status,short].filter(Boolean).join('。');
  button.setAttribute('aria-pressed',String(!!gesture));button.setAttribute('aria-label',message+'。上划抬竿，下划让线，滑回中位，横移调竿');
  if(reader.textContent!==message)reader.textContent=message;
 }
 function transient(kind){if(event===kind)return;event=kind;clearTimeout(eventTimer);eventTimer=setTimeout(()=>{event='';render();},650);}
 function end(cancelled=false){const accepted=lifted;gesture=null;held=paying=lifted=false;dx=dy=0;released=scene==='danger';if(accepted&&!cancelled)transient('lift');render();}
 function stopPlayback(){if(playing){playing=false;cancelAnimationFrame(playFrame);playFrame=0;play.textContent='播放手势';end(true);}}
 function reset(){stopPlayback();clearTimeout(eventTimer);event='';gesture=null;held=paying=lifted=released=windowUsed=false;dx=dy=0;render();}
 function begin(id,x,y){
  if(gesture||![x,y].every(Number.isFinite))return;
  if(scene==='retrieve'){transient('retrieved');render();return;}
  if(scene==='bite'){scene='steady';picker.value=scene;transient('hooked');}
  gesture={id,x,y};held=true;released=false;paying=lifted=false;dx=dy=0;render();
 }
 function move(x,y){
  if(!gesture||![x,y].every(Number.isFinite))return;
  dx=x-gesture.x;dy=y-gesture.y;const lane=Math.abs(dx)<=30;
  if(lifted){if(lane&&dy>=-12){lifted=false;paying=dy>=24;held=!paying;}}
  else if(paying){if(lane&&dy<=10){paying=false;held=true;}}
  else if(lane&&dy>=24){paying=true;held=false;}
  else if(lane&&dy < -42){if(scene==='window'&&!windowUsed){lifted=true;held=false;windowUsed=true;}else transient(scene==='slack'?'slack':'blocked');}
  render();
 }
 button.addEventListener('pointerdown',e=>{stopPlayback();if(gesture)return;e.preventDefault();begin(e.pointerId,e.clientX,e.clientY);if(gesture)button.setPointerCapture(e.pointerId);});
 button.addEventListener('pointermove',e=>{if(gesture?.id===e.pointerId)move(e.clientX,e.clientY);});
 for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,e=>{if(gesture?.id===e.pointerId)end(type!=='pointerup');});
 button.addEventListener('keydown',e=>{if([' ','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape'].includes(e.key)){e.preventDefault();stopPlayback();if(e.key==='Escape')end(true);else{if(!gesture)begin('keyboard',0,0);if(e.key==='ArrowUp')move(0,-48);if(e.key==='ArrowDown')move(0,30);if(e.key==='ArrowLeft')move(-45,0);if(e.key==='ArrowRight')move(45,0);}}});
 button.addEventListener('keyup',e=>{if([' ','Enter'].includes(e.key))end();});
 button.addEventListener('blur',()=>end(true));
 window.addEventListener('blur',()=>{stopPlayback();end(true);});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){stopPlayback();end(true);}});
 picker.addEventListener('change',()=>{reset();scene=allowed.includes(picker.value)?picker.value:'steady';render();window.openai?.setWidgetState?.({modelContent:{scene}})?.catch(()=>{});});
 window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState?.modelContent?.scene;if(allowed.includes(next)){reset();scene=next;picker.value=scene;render();}});
 play.addEventListener('click',()=>{
  if(playing){stopPlayback();return;}reset();scene='window';picker.value=scene;playing=true;play.textContent='停止演示';begin('demo',0,0);
  const points=[[0,0,0],[700,0,0],[1300,0,-52],[1700,0,-52],[2300,0,0],[2800,0,32],[3300,0,32],[3800,0,0],[4250,-42,0],[4750,42,0],[5200,0,0],[5600,0,0]];
  let start=null;
  function frame(time){if(!playing)return;if(start===null)start=time;const elapsed=time-start;if(elapsed>=5600){playing=false;playFrame=0;play.textContent='播放手势';end();return;}
   let i=0;while(i<points.length-2&&elapsed>points[i+1][0])i++;
   const a=points[i],b=points[i+1],p=Math.max(0,Math.min(1,(elapsed-a[0])/(b[0]-a[0])));move(a[1]+(b[1]-a[1])*p,a[2]+(b[2]-a[2])*p);playFrame=requestAnimationFrame(frame);
  }playFrame=requestAnimationFrame(frame);
 });
 picker.value=scene;render();
})();
</script>
